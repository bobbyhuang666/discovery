schema_version: '1.0'
audit_type: protocol_contract
warning: Measures explicit protocol coverage in source artifacts, not live model quality
  or project popularity.
ranking:
- name: Discovery v17.1
  profile: benchmarks/profiles/discovery-v17.1.yaml
  weighted_score: 280
  max_weighted_score: 284
  coverage_percent: 98.6
  notes: Runtime candidate with Quick Exit, capability negotiation, and light-model
    contracts. Scores show explicit contract coverage, not proven live-model superiority.
- name: GSD
  profile: benchmarks/profiles/gsd.yaml
  weighted_score: 252
  max_weighted_score: 284
  coverage_percent: 88.7
  notes: 'Deep context engineering and execution reliability: adaptive questioning,
    research, persistent state, multi-workstream, verification gates, claim provenance,
    cross-AI review, and broad runtime support.'
- name: BMad Method
  profile: benchmarks/profiles/bmad.yaml
  weighted_score: 233
  max_weighted_score: 284
  coverage_percent: 82.0
  notes: Broad lifecycle coverage with create/update/validate intents, adaptive quick
    and enterprise paths, product validation, project context, readiness gates, and
    specialized roles.
- name: OpenSpec
  profile: benchmarks/profiles/openspec.yaml
  weighted_score: 194
  max_weighted_score: 284
  coverage_percent: 68.3
  notes: Best-in-class fluid artifact actions and living change lifecycle, especially
    for brownfield and parallel changes. Discovery evidence and opportunity validation
    are not its primary focus.
- name: Discovery v15
  profile: benchmarks/profiles/discovery-v15.yaml
  weighted_score: 191
  max_weighted_score: 284
  coverage_percent: 67.3
  notes: Baseline before competitor-driven v16 changes.
- name: GitHub Spec Kit
  profile: benchmarks/profiles/spec-kit.yaml
  weighted_score: 179
  max_weighted_score: 284
  coverage_percent: 63.0
  notes: Strong constitution, five-question clarification budget, incremental spec
    updates, checklists, planning and readiness flow. Less specialized for opportunity
    discovery and visual elicitation.
- name: Superpowers Brainstorming
  profile: benchmarks/profiles/superpowers.yaml
  weighted_score: 136
  max_weighted_score: 284
  coverage_percent: 47.9
  notes: Strong approval-gated design dialogue, alternatives, scope decomposition,
    and visual companion; intentionally not a full requirements-governance system.
- name: Matt Pocock Grilling
  profile: benchmarks/profiles/grilling.yaml
  weighted_score: 65
  max_weighted_score: 284
  coverage_percent: 22.9
  notes: 'Exceptional minimal interview primitive: inspect facts, ask decisions, follow
    decision dependencies, recommend answers. Deliberately delegates specifications
    and governance elsewhere.'
